openapi: 3.2.0
info:
  title: Bigone Ping API
  version: 1.0.0
  contact:
    email: developer@big.one
  description: 'Operations tagged Ping across 2 of this provider''s published API definitions: spot_server.yml, bigone-server-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.big.one/api/v3
tags:
- name: Ping
paths:
  /ping:
    get:
      summary: Get Server Time
      description: 'Returns the current server timestamp in nanoseconds.


        This endpoint is commonly used for:

        - Checking server connectivity and measuring latency

        - Synchronizing client clocks with the server

        - Verifying API availability'
      operationId: getPing
      responses:
        '200':
          description: Server timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  Timestamp:
                    type: integer
                    format: int64
                    description: The current server timestamp in nanoseconds (Unix time with nanosecond precision).
                    example: 1528102434742412000
      tags:
      - Ping
    servers:
    - url: https://api.big.one/api/v3
x-refined-from:
- spot_server.yml
- bigone-server-openapi.yml
