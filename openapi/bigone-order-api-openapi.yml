openapi: 3.2.0
info:
  title: Bigone Order API
  contact:
    email: developer@big.one
  version: '1.0'
  description: 'Operations tagged Order across 4 of this provider''s published API definitions: contract_rest.yml, spot_rest.yml, bigone-contract-openapi.yml, bigone-spot-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.big.one/api/contract/v2
- url: https://api.big.one/api/v3
tags:
- name: Order
  description: Order Management
paths:
  /orders:
    post:
      tags:
      - Order
      summary: Place Order
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
            example:
              size: 1
              symbol: BTCUSD
              type: LIMIT
              side: BUY
              price: 8000
              reduceOnly: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                meta: null
                reduceOnly: false
                symbol: BTCUSD
                type: LIMIT
                userId: 5aec525e-335d-4724-0005-20153b361f89
                liquidateUserId: null
                size: 1
                notional: 0
                status: UNTRIGGERED
                id: 5aed7b45-5d19-40f2-0005-ca49d01f33e3
                side: BUY
                filledNotional: 0
                seqNo: null
                filled: 0
                price: 8000
                conditional:
                  type: REACH
                  priceType: MARKET_PRICE
                  price: 8000
      operationId: postOrders
      x-operation-id-source: derived
    get:
      tags:
      - Order
      summary: Get Order List
      security:
      - bearerAuth: []
      parameters:
      - name: symbol
        in: query
        schema:
          type: string
          example: BTCUSD
        description: Contract Symbol (e.g. BTCUSD)
      - name: start-time
        in: query
        schema:
          type: integer
          format: int64
          example: 1562125342068
        description: Start Time (Timestamp)
      - name: end-time
        in: query
        schema:
          type: integer
          format: int64
          example: 1583510400000
        description: End Time (Timestamp). Will be overwritten by id
      - name: id
        in: query
        schema:
          type: string
        description: Pagination offset ID. Returns orders older than this ID.
      - name: type
        in: query
        schema:
          type: string
          enum:
          - LIMIT
          - MARKET
          - IOC
          - FOK
          - POST_ONLY
        description: Order Type
      - name: side
        in: query
        schema:
          type: string
          enum:
          - BUY
          - SELL
        description: Order Side
      - name: status
        in: query
        schema:
          type: string
          example: NEW,PARTIALLY_FILLED
        description: 'Order Status. Multiple status separated by comma. Enums: NEW, PARTIALLY_FILLED, PARTIALLY_CANCELED, CANCELED, REJECTED, FILLED, UNTRIGGERED, PENDING_CANCEL'
      - name: opt
        in: query
        schema:
          type: string
          enum:
          - TRIGGERED
          - LIQUIDATE
          - PROFIT
        description: Order Class
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
        description: Page size limit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
              - liquidateUserId: null
                id: 5aed94fc-703e-42a2-0005-578d4c468767
                ts: 1562132083136
                side: BUY
                userId: 5aec525e-335d-4724-0005-20153b361f89
                filledNotional: 0
                notional: 0.102512
                status: NEW
                isLiquidate: false
                reduceOnly: false
                type: LIMIT
                symbol: BTCUSD
                seqNo: null
                filled: 0
                conditional: null
                size: 1000
                avgPrice: 0
                price: 9755
                meta:
                  bestPrice: 11311
                  markPrice: 11536.1075491
                  bestPrices:
                    ask: 11311
                    bid: 11305.5
      operationId: getOrders
      x-operation-id-source: derived
    servers:
    - url: https://api.big.one/api/contract/v2
  /orders/opening:
    get:
      tags:
      - Order
      summary: Get Active Order List
      security:
      - bearerAuth: []
      parameters:
      - name: symbol
        in: query
        schema:
          type: string
          example: BTCUSD
        description: Contract types, includes BTCUSD, ETHUSD, EOSUSD
      - name: id
        in: query
        schema:
          type: string
        description: Pagination offset ID. Returns orders older than this ID.
      - name: start-time
        in: query
        schema:
          type: integer
          format: int64
          example: 1562125342068
        description: Query starting time
      - name: end-time
        in: query
        schema:
          type: integer
          format: int64
          example: 1583510400000
        description: Query ending time. Will be overwritten by id
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          example: 20
        description: Response limit per request
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
              - liquidateUserId: null
                ts: 1562125342068
                size: 1
                notional: 0
                side: BUY
                userId: 5aec525e-335d-4724-0005-20153b361f89
                filledNotional: 0
                isLiquidate: false
                reduceOnly: false
                type: LIMIT
                symbol: BTCUSD
                seqNo: null
                filled: 0
                meta: null
                status: UNTRIGGERED
                avgPrice: 0
                price: 8000
                conditional:
                  type: REACH
                  price: 8000
                  priceType: MARKET_PRICE
                id: 5aed7b45-5d19-40f2-0005-ca49d01f33e3
      operationId: getOrdersOpening
      x-operation-id-source: derived
    servers:
    - url: https://api.big.one/api/contract/v2
  /orders/{id}:
    get:
      tags:
      - Order
      summary: Get Order Detail
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: 5aed7b45-5d19-40f2-0005-ca49d01f33e3
        description: Order ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                liquidateUserId: null
                id: 5aed94fc-703e-42a2-0005-578d4c468767
                ts: 1562132083136
                side: BUY
                userId: 5aec525e-335d-4724-0005-20153b361f89
                filledNotional: 0
                notional: 0.102512
                status: NEW
                isLiquidate: false
                reduceOnly: false
                type: LIMIT
                symbol: BTCUSD
                seqNo: null
                filled: 0
                conditional: null
                size: 1000
                avgPrice: 0
                price: 9755
                meta:
                  bestPrice: 11311
                  markPrice: 11536.1075491
                  bestPrices:
                    ask: 11311
                    bid: 11305.5
      operationId: getOrdersById
      x-operation-id-source: derived
    delete:
      tags:
      - Order
      summary: Cancel Order
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: 5aed7b45-5d19-40f2-0005-ca49d01f33e3
        description: Order ID
      responses:
        '200':
          description: Success
      operationId: deleteOrdersById
      x-operation-id-source: derived
    servers:
    - url: https://api.big.one/api/contract/v2
  /orders/count:
    get:
      tags:
      - Order
      summary: Count Orders
      security:
      - bearerAuth: []
      parameters:
      - name: symbol
        in: query
        schema:
          type: string
          example: BTCUSD
        description: Contract Symbol
      - name: id
        in: query
        schema:
          type: string
        description: Pagination offset ID. Returns orders older than this ID.
      - name: start-time
        in: query
        schema:
          type: integer
          format: int64
          example: 1562125342068
        description: Start Time (Timestamp)
      - name: end-time
        in: query
        schema:
          type: integer
          format: int64
          example: 1583510400000
        description: End Time (Timestamp). Will be overwritten by id
      - name: type
        in: query
        schema:
          type: string
          enum:
          - LIMIT
          - MARKET
          - IOC
          - FOK
          - POST_ONLY
          - ADL
        description: Order Type
      - name: side
        in: query
        schema:
          type: string
          enum:
          - BUY
          - SELL
        description: Order Side
      - name: status
        in: query
        schema:
          type: string
          example: NEW,PARTIALLY_FILLED
        description: 'Order Status. Multiple status separated by comma. Enums: NEW, PARTIALLY_FILLED, PARTIALLY_CANCELED, CANCELED, REJECTED, FILLED, UNTRIGGERED, PENDING_CANCEL'
      - name: opt
        in: query
        schema:
          type: string
          enum:
          - TRIGGERED
          - LIQUIDATE
          - PROFIT
        description: Order Class
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
              example:
                count: 1
      operationId: getOrdersCount
      x-operation-id-source: derived
    servers:
    - url: https://api.big.one/api/contract/v2
  /orders/opening/count:
    get:
      tags:
      - Order
      summary: Count Active Orders
      security:
      - bearerAuth: []
      parameters:
      - name: symbol
        in: query
        schema:
          type: string
        description: Contract Symbol
      - name: start-time
        in: query
        schema:
          type: integer
          format: int64
          example: 1562125342068
        description: Start Time (Timestamp)
      - name: end-time
        in: query
        schema:
          type: integer
          format: int64
          example: 1583510400000
        description: End Time (Timestamp)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
              example:
                count: 2
      operationId: getOrdersOpeningCount
      x-operation-id-source: derived
    servers:
    - url: https://api.big.one/api/contract/v2
  /viewer/orders:
    get:
      tags:
      - Order
      summary: Get Orders
      description: Returns paginated orders for a specific asset pair.
      operationId: getViewerOrders
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: asset_pair_name
        required: true
        schema:
          type: string
        description: The asset pair name.
        example: BTC-USDT
      - in: query
        name: page_token
        required: false
        schema:
          type: string
        description: Pagination token from the previous response.
      - in: query
        name: side
        required: false
        schema:
          type: string
          enum:
          - ASK
          - BID
        description: Filter by order side.
      - in: query
        name: state
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - OPENING
          - CLOSED
          - NONE_FILLED
          - ALL
          default: PENDING
        description: Filter by order state.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 200
        description: The maximum number of orders to return.
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order_2'
      x-operation-id-source: normalized
      x-operation-id-original: getOrders
    post:
      tags:
      - Order
      summary: Create Order
      description: Creates a new order.
      operationId: createOrder
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderBody'
      responses:
        '200':
          description: Created Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_2'
        '400':
          description: Invalid parameters or order error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parameter_error:
                  value:
                    code: 10007
                    message: Parameter error
                insufficient_funds:
                  value:
                    code: 10014
                    message: Insufficient funds
                duplicate_order:
                  value:
                    code: 54041
                    message: Duplicate order
                liquidity_too_much:
                  value:
                    code: 50047
                    message: Liquidity taken too much
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Permission denied or order forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                permission_denied:
                  value:
                    code: 10403
                    message: Permission denied
                order_forbidden:
                  value:
                    code: 40304
                    message: Creating order is forbidden
                account_restricted:
                  value:
                    code: 40305
                    message: Account restricted
                pair_suspended:
                  value:
                    code: 60100
                    message: Asset pair is suspended
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://api.big.one/api/v3
  /viewer/orders/{id}:
    get:
      tags:
      - Order
      summary: Get Order by ID
      description: Returns a specific order by ID.
      operationId: getOrderById
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
        example: 12345678
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_2'
    servers:
    - url: https://api.big.one/api/v3
  /viewer/order:
    get:
      tags:
      - Order
      summary: Get Order by ID or Client ID
      description: Returns a specific order.
      operationId: getOrder
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: order_id
        schema:
          type: integer
          format: int64
      - in: query
        name: client_order_id
        schema:
          type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_2'
    servers:
    - url: https://api.big.one/api/v3
  /viewer/orders/multi:
    post:
      tags:
      - Order
      summary: Create Multiple Orders
      description: Creates multiple orders in a batch.
      operationId: createMultiOrders
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateOrderBody'
      responses:
        '200':
          description: List of created orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order_2'
    servers:
    - url: https://api.big.one/api/v3
  /viewer/orders/{id}/cancel:
    post:
      tags:
      - Order
      summary: Cancel Order by ID (Path)
      description: Cancels a specific order.
      operationId: cancelOrderByIdPath
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
        example: 12345678
      responses:
        '200':
          description: Cancelled Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_2'
    servers:
    - url: https://api.big.one/api/v3
  /viewer/order/cancel:
    post:
      tags:
      - Order
      summary: Cancel Order by ID or Client ID
      description: Cancels a specific order. **Either `order_id` or `client_order_id` must be provided.**
      operationId: cancelOrder
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderBody'
      responses:
        '200':
          description: Cancelled Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_2'
    servers:
    - url: https://api.big.one/api/v3
  /viewer/orders/cancel:
    post:
      tags:
      - Order
      summary: Cancel All Orders
      description: Cancels all orders for a specific asset pair.
      operationId: cancelAllOrders
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAllOrdersBody'
      responses:
        '200':
          description: Cancelled orders summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      cancelled:
                        type: array
                        items:
                          type: integer
                          format: int64
                      failed:
                        type: array
                        items:
                          type: object
    servers:
    - url: https://api.big.one/api/v3
components:
  schemas:
    ConditionalOrder:
      type: object
      description: Conditional Order Settings
      properties:
        price:
          type: number
          description: Trigger Price. The order will be triggered when the specified price type hits this price.
          example: 8000
        priceType:
          type: string
          enum:
          - MARK_PRICE
          - INDEX_PRICE
          - MARKET_PRICE
          description: Trigger Price Type. Defines which price (Mark/Index/Last) is compared against the trigger price.
          example: MARKET_PRICE
        type:
          type: string
          enum:
          - STOP_LOSS
          - TAKE_PROFIT
          - REACH
          description: 'Trigger Condition. REACH: Standard trigger. STOP_LOSS/TAKE_PROFIT: Intended for stop/profit orders.'
          example: REACH
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Order ID
          example: 5aed7b45-5d19-40f2-0005-ca49d01f33e3
        symbol:
          type: string
          description: Contract Symbol
          example: BTCUSD
        side:
          type: string
          enum:
          - BUY
          - SELL
          description: Order Side
          example: BUY
        type:
          type: string
          enum:
          - LIMIT
          - MARKET
          - IOC
          - FOK
          - POST_ONLY
          description: Order Type
          example: LIMIT
        price:
          type: number
          description: Order Price
          example: 8000
        size:
          type: number
          description: Order Size (Number of contracts)
          example: 1
        status:
          type: string
          enum:
          - NEW
          - PARTIALLY_FILLED
          - PARTIALLY_CANCELED
          - CANCELED
          - REJECTED
          - FILLED
          - UNTRIGGERED
          - PENDING_CANCEL
          description: Order Status
          example: NEW
        filled:
          type: number
          description: Filled Quantity
          example: 0
        notional:
          type: number
          description: Order Notional Value
          example: 0.102512
        avgPrice:
          type: number
          description: Average Execution Price
          example: 0
        filledNotional:
          type: number
          description: Filled Notional Value
          example: 0
        reduceOnly:
          type: boolean
          description: Reduce Only Order
          example: false
        isLiquidate:
          type: boolean
          description: Is Liquidation Order
          example: false
        userId:
          type: string
          description: User ID
          example: 5aec525e-335d-4724-0005-20153b361f89
        liquidateUserId:
          type:
          - string
          - 'null'
          description: Liquidated User ID
          example: null
        conditional:
          $ref: '#/components/schemas/ConditionalOrder'
        ts:
          type: integer
          format: int64
          description: Order Timestamp (Unix Microseconds)
          example: 1562132083136
        seqNo:
          type:
          - integer
          - 'null'
          format: int64
          description: Sequence Number
          example: 123456
        meta:
          type:
          - object
          - 'null'
          description: Order Meta Data
          properties:
            bestPrice:
              type:
              - number
              - 'null'
              description: May be null depending on order state
              example: 11311
            markPrice:
              type:
              - number
              - 'null'
              description: May be null depending on order state
              example: 11536.1075491
            bestPrices:
              type:
              - object
              - 'null'
              description: May be null depending on order state
              properties:
                ask:
                  type: number
                bid:
                  type: number
    PlaceOrderRequest:
      type: object
      required:
      - symbol
      - side
      - type
      - size
      properties:
        symbol:
          type: string
          description: Contract Instrument Symbol (e.g. BTCUSD)
          example: BTCUSD
        side:
          type: string
          enum:
          - BUY
          - SELL
          description: Order Side
          example: BUY
        type:
          type: string
          enum:
          - LIMIT
          - MARKET
          - IOC
          - FOK
          - POST_ONLY
          description: Order Type
          example: LIMIT
        price:
          type: number
          description: Order Price (Required for LIMIT orders)
          example: 8000
        size:
          type: number
          description: Number of contracts
          example: 100
        reduceOnly:
          type: boolean
          default: false
          description: Reduce Only Order. If true, the order will only reduce your position, not increase it. If the order would increase your position, it is automatically amended down or canceled.
          example: false
    Order_2:
      type: object
      description: Order details including status, execution, and conditional order settings.
      properties:
        id:
          type: integer
          format: int64
          description: The unique order ID assigned by BigONE.
          example: 12345678
        asset_pair_name:
          type: string
          description: The asset pair name.
          example: BTC-USDT
        price:
          type: string
          description: The order price.
          example: '50000.00'
        amount:
          type: string
          description: The original order amount (base asset quantity).
          example: '0.5'
        filled_amount:
          type: string
          description: The amount that has been filled.
          example: '0.25'
        avg_deal_price:
          type: string
          description: The average fill price of executed portions.
          example: '49950.00'
        side:
          type: string
          description: The order side. ASK = sell, BID = buy.
          enum:
          - ASK
          - BID
          example: BID
        state:
          type: string
          description: The current order state.
          enum:
          - FILLED
          - PENDING
          - CANCELLED
          - FIRED
          - REJECTED
          example: PENDING
        created_at:
          type: string
          format: date-time
          description: The timestamp when the order was created (ISO 8601).
          example: '2024-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: The timestamp when the order was last updated (ISO 8601).
          example: '2024-01-15T10:35:00Z'
        type:
          type: string
          description: The order type.
          enum:
          - LIMIT
          - MARKET
          - STOP_LIMIT
          - STOP_MARKET
          example: LIMIT
        stop_price:
          type: string
          description: The trigger price for stop orders.
          example: '49500.00'
        operator:
          type: string
          description: The trigger condition for stop orders. GTE = triggered when price >= stop_price, LTE = triggered when price <= stop_price.
          enum:
          - GTE
          - LTE
          example: GTE
        immediate_or_cancel:
          type: boolean
          description: Whether this is an Immediate-or-Cancel order.
        post_only:
          type: boolean
          description: Whether this is a post-only order.
        client_order_id:
          type: string
          description: The user-specified client order ID.
          example: my-order-001
    CreateOrderBody:
      type: object
      required:
      - asset_pair_name
      - side
      - amount
      - type
      properties:
